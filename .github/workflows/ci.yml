name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run foundation tests
        run: swift test

      - name: Build pinned recovery engines
        run: Scripts/build-recovery-engines.sh "$RUNNER_TEMP/RecoveryEngines"

      - name: Run recovery-quality release gate
        env:
          PHOTOREC_EXECUTABLE: ${{ runner.temp }}/RecoveryEngines/Helpers/photorec
        run: Scripts/run-recovery-benchmark.sh

      - name: Build release configuration
        run: >-
          xcodebuild
          -project 'Aagedal Data Revival.xcodeproj'
          -scheme 'Aagedal Data Revival'
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DataRevivalDerived"
          RECOVERY_ENGINE_PRODUCTS_DIR="$RUNNER_TEMP/RecoveryEngines"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify arm64-only application and engines
        shell: bash
        run: |
          app="$RUNNER_TEMP/DataRevivalDerived/Build/Products/Release/Aagedal Data Revival.app"
          for binary in \
            "$app/Contents/MacOS/Aagedal Data Revival" \
            "$app/Contents/Helpers/photorec" \
            "$app/Contents/Helpers/ddrescue"
          do
            test "$(lipo -archs "$binary")" = arm64
          done
          test ! -e "$app/Contents/MacOS/DataRevivalImagingHelper"
          test ! -e "$app/Contents/Library/LaunchDaemons/com.aagedal.DataRevival.ImagingHelper.plist"
          info_plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$info_plist")" = 'Aagedal Data Revival'
          test "$(plutil -extract LSApplicationCategoryType raw -o - "$info_plist")" = 'public.app-category.utilities'
          icon_file="$(plutil -extract CFBundleIconFile raw -o - "$info_plist")"
          test -f "$app/Contents/Resources/${icon_file%.icns}.icns"
          artifacts="$app/Contents/Resources/RecoveryEngines"
          test -f "$artifacts/Licenses/PhotoRec-COPYING.txt"
          test -f "$artifacts/Licenses/GNU-ddrescue-COPYING.txt"
          test -f "$artifacts/Notices/PhotoRec-AUTHORS.txt"
          test -f "$artifacts/Notices/GNU-ddrescue-AUTHORS.txt"
          test -f "$artifacts/SourceArchives/testdisk-7.2.tar.bz2"
          test -f "$artifacts/SourceArchives/ddrescue-1.30.tar.lz"
          test -f "$artifacts/SourcePatches/ddrescue-inherited-stdin.patch"
          test -f "$artifacts/RecoveryEngines.lock.json"
          test -f "$artifacts/SHA256SUMS"
